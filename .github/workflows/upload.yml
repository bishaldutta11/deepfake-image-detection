name: Build and Upload Artifact

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Optional: Add a step here to run unit tests if you create any
    # - name: Run tests
    #   run: |
    #     pytest

    - name: Package Application
      run: |
        zip -r deepfake-app.zip . -x "*.git*" -x "*__pycache__*" -x "venv*"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: deepfake-app-build
        path: deepfake-app.zip

    # ---------------------------------------------------------
    # Example: Automatically deploy/upload to a remote server
    # Uncomment and configure the secrets in your GitHub repo 
    # if you want it to automatically upload to a live server.
